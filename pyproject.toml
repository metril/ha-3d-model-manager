[project]
name = "ha-3d-model-manager-integration"
version = "0.1.0"
description = "Home Assistant integration for 3D Model Manager (tdmm)"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-homeassistant-custom-component>=0.13.316",
    "pytest-xdist",
    "pytest-split",
    "pytest-aiohttp",
    "pyyaml",
    "pyturbojpeg>=2.6.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["voluptuous.*"]
ignore_missing_imports = true
