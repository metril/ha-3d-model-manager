name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(jq -r .version custom_components/tdmm/manifest.json)" >> "$GITHUB_OUTPUT"
      - id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.tag.outputs.exists == 'false'
        working-directory: frontend
        run: |
          npm install -g npm@11.12.1
          npm ci
          npm run build
      - name: Verify committed bundle is fresh
        if: steps.tag.outputs.exists == 'false'
        run: git diff --exit-code -- custom_components/tdmm/frontend/tdmm-cards.js
      - name: Package
        if: steps.tag.outputs.exists == 'false'
        run: cd custom_components/tdmm && zip -r ../../tdmm.zip .
      - if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: tdmm.zip
          generate_release_notes: true
          make_latest: true
